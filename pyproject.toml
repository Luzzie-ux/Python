[tool.black]
line-length = 79
target-version = ["py314"]
skip-string-normalization = false
skip-magic-trailing-comma = false
preview = false

[tool.mypy]
python_version = "3.14"
strict = true
exclude = [
    ".venv/",
    ".git/",
    "__pycache__/",
    "matrix_env/",
    "vpip/",
    "vpoetry/",
]

[tool.flake8]
max-line-length = 79
extend-ignore = ["E203", "W503"]
extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    "matrix_env",
    "vpip",
    "vpoetry",
]
count = true
statistics = true
show-source = true
per-file-ignores = [
    "__init__.py:F401",
]