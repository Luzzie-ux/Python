# ===================
# « Project section »
# ===================

[project]
name = "python_modules"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "mypy>=2.3.0",
    "pydantic>=2.13.4",
    "ruff>=0.16.2",
    "ty>=0.0.69",
    # exclude afterwards
    "python-dotenv==1.2.2",
    "numpy (>=2.5.1,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pandas-stubs>=3.0.5.260730",
]

# =================
# « Tools section »
# =================

# My Ruff Config:
[tool.ruff]
indent-width = 4
line-length = 79
respect-gitignore = true
target-version = "py314"
extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]
show-fixes = true
#output-format = "grouped"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

[tool.ruff.lint]
#preview = true
#select = ["ALL"]
extend-select = ["E", "F", "W"]

# ignore = [
#     "T201",     # print statements allowed (flake8-print)
#     "D",        # all pydocstyle/docstring rules off
#     "DOC",      # docstring content rules (pydoclint) off
#     "CPY",      # copyright notice checks off
#     "SLF001",   # allow accessing "private" (_attr) members
#     "RUF201",   # a specific ruff-native rule off (unused-noqa-directive variant, check ruff changelog for exact meaning per version)
#     "PLR6301",  # pylint: method could be a function/staticmethod — off
#     "PLR0913",  # pylint: too many arguments — off
#     "PLR0917",  # pylint: too many positional arguments — off
#     "PLC0415",  # pylint: import not at top of file — off (allows local imports)
#     "PTH",      # flake8-use-pathlib — off (allows os.path instead of pathlib)
#     "ANN401",   # allow explicit "Any" type annotations
#     "FBT",      # flake8-boolean-trap — off (allows bare bool positional args)
#     "S311",     # bandit: allow non-cryptographic random (random.random) without warning
#     "TID252",   # flake8-tidy-imports — off (allows relative imports)
#     "SIM115",   # allow context-manager-less file open() (the rule we discussed earlier)
# ]
fixable = ["ALL"]
unfixable = []


[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"m0/**/*.py" = ["INP001"]
"m2/**/*.py" = ["SIM115"]
"m4/**/*.py" = ["SIM115"]
"m5" = ["ANN401"]

# 42 Tools Config:
[tool.flake8]
max-line-length = 79
extend-ignore = ["E203", "W503"]
extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]
count = true
statistics = true
show-source = true
per-file-ignores = [
    "__init__.py:F401",
]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = [
    ".venv/",
    ".git/",
    "build/",
    "dist/",
    "__pycache__/",
    ".ruff_cache"
]
